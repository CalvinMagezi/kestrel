[workspace]
resolver = "3"
members = ["crates/fx-core", "crates/fx-feed", "crates/fx-harness"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
