<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Kestrel</title>
<style>
/*TOKENS_CSS*/
/*COMPONENTS_CSS*/
html,body{margin:0;height:100%}
body{background:var(--surface);color:var(--ink);font:400 15px/22px var(--font-sans);-webkit-text-size-adjust:100%}
#app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.view[hidden],[hidden]{display:none!important}
.scroll>*{flex:none}
.k-badge{white-space:nowrap;flex:none}
.k-tile__value{font-size:clamp(20px,6.2vw,28px);white-space:nowrap}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-6)}
.mark{width:32px;height:32px;flex:none}
.mark .wing{fill:none;stroke:var(--ink);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.mark .dot{fill:var(--mark-dot)}
:root,[data-theme="dark"]{--mark-dot:#f5a524}
[data-theme="light"]{--mark-dot:#b86e00}
.k-appbar__end[hidden]{display:none}
.tabs{display:flex;border-top:1px solid var(--border);background:var(--surface-raised);padding-bottom:env(safe-area-inset-bottom)}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;border-top:2px solid transparent;margin-top:-1px;color:var(--ink-muted);font:600 11px/14px var(--font-sans);text-decoration:none}
.tabs a:focus-visible{outline:2px solid var(--focus-ring);outline-offset:-4px}
.tabs a[aria-current="page"]{color:var(--ink);border-top-color:var(--accent)}
.log{flex:1;min-height:0;overflow-y:auto;padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3)}
.chips{display:flex;gap:var(--space-2);padding:var(--space-2) var(--space-4);overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.k-bubble--wide{align-self:stretch}
.res{display:grid;grid-template-columns:1fr auto;gap:4px 16px;margin:8px 0;padding:8px 0;border-block:1px solid var(--border);font:500 13px/20px var(--font-mono);font-variant-numeric:tabular-nums}
.res .l{color:var(--ink-muted);font-family:var(--font-sans);font-weight:400}
.res .v{display:inline-flex;align-items:center;gap:4px;justify-content:flex-end;text-align:right}
.res .k-icon{width:14px;height:14px}
.li{padding-left:1em;text-indent:-1em}
.note:empty{display:none}
.note{font:400 12px/16px var(--font-sans);color:var(--ink-muted)}
.sec{margin:0 0 8px;font:600 11px/14px var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted)}
.card{border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;background:var(--surface-raised)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-3)}
.muted{margin:0;color:var(--ink-muted)}
.step{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;box-sizing:border-box;min-height:56px;padding:8px 16px;border:0;border-bottom:1px solid var(--border);background:transparent;color:var(--ink);font:inherit;text-align:left;text-decoration:none}
.step:last-child{border-bottom:0}
.step b{display:block;font:600 15px/22px var(--font-sans)}
.step small{display:block;font:400 12px/16px var(--font-sans);color:var(--ink-muted)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--border-strong);border-radius:var(--radius-md);overflow:hidden}
.stepper button{width:48px;height:48px;border:0;background:transparent;color:var(--ink);font:600 20px/24px var(--font-sans);cursor:pointer}
.stepper button:focus-visible{outline:2px solid var(--focus-ring);outline-offset:-4px}
.stepper output{min-width:64px;text-align:center;font:600 15px/22px var(--font-mono);font-variant-numeric:tabular-nums}
.n{flex:none;width:28px;height:28px;border-radius:var(--radius-full);border:1px solid var(--border-strong);display:grid;place-items:center;font:600 13px/16px var(--font-mono)}
.run .step{align-items:flex-start}
.run .step .k-badge{margin-left:auto;flex:none}
.run .step small{margin-top:2px;font-size:13px;line-height:18px}
.hero{display:flex;flex-direction:column;gap:var(--space-2)}
.hero h1{margin:0;font:600 32px/36px var(--font-sans);letter-spacing:-.02em}
.stack{display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-4) var(--space-4) var(--space-6)}
.btnrow{display:flex;flex-direction:column;gap:var(--space-2)}
.k-btn{cursor:pointer}
.err{padding:var(--space-4)}
.upd{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 16px;background:var(--surface-raised);border-bottom:1px solid var(--border)}
.upd .txt{flex:1 1 200px;font:500 14px/20px var(--font-sans)}
.upd .txt small{display:block;font:400 12px/16px var(--font-sans);color:var(--ink-muted)}
.upd .acts{display:flex;gap:8px;flex-wrap:wrap}
.upd .k-btn{min-height:40px;padding:0 14px;font-size:14px}
.upd .meter{flex-basis:100%;height:4px;background:var(--border);border-radius:var(--radius-full);overflow:hidden}
.upd .meter i{display:block;height:100%;background:var(--accent)}
.upd .notes{flex-basis:100%;font:400 13px/18px var(--font-sans);color:var(--ink-muted);white-space:pre-wrap}
.step.col{flex-direction:column;align-items:stretch}
.btns{display:flex;gap:8px}
.btns .k-btn{flex:1}
.def{padding:12px 16px;border-bottom:1px solid var(--border)}
.def:last-child{border-bottom:0}
.def b{display:block;font:600 15px/22px var(--font-sans)}
.def span{display:block;font:400 14px/20px var(--font-sans);color:var(--ink-muted)}
.calc{padding:16px;display:grid;gap:12px}
.calc label{display:grid;gap:4px;font:600 12px/16px var(--font-sans);color:var(--ink-muted)}
.calc input,.calc select{min-height:48px;padding:0 12px;border-radius:var(--radius-md);border:1px solid var(--border-strong);background:var(--surface-sunken);color:var(--ink);font:500 15px/22px var(--font-mono)}
.calc input:focus-visible,.calc select:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.calc .row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.calc label,.calc .row2>*{min-width:0}
.calc input,.calc select{width:100%;min-width:0;box-sizing:border-box}
.out{border-top:1px solid var(--border);padding-top:12px;display:grid;gap:4px;font:500 14px/20px var(--font-mono)}
.out .l{color:var(--ink-muted);font-family:var(--font-sans);font-weight:400}
.ugx{margin-top:2px;font:500 12px/16px var(--font-mono);color:var(--ink-muted)}
.form{padding:16px;display:grid;gap:12px;border-top:1px solid var(--border)}
.form input{min-height:48px;padding:0 12px;border-radius:var(--radius-md);border:1px solid var(--border-strong);background:var(--surface-sunken);color:var(--ink);font:500 15px/22px var(--font-mono)}
.form input:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.seal{font:500 13px/18px var(--font-mono);color:var(--ink-muted);word-break:break-all}
</style>
</head>
<body>
<div id="app">
  <header class="k-appbar" id="bar">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><path class="wing" d="M5 28 L21 15 L32 27 L43 15 L59 28"/><circle class="dot" cx="32" cy="44" r="6"/></svg>
    <div>
      <div class="k-appbar__name" id="title">Kestrel</div>
      <div class="k-appbar__sub">Paper account · research only</div>
    </div>
    <span class="k-badge k-appbar__end" id="state" hidden></span>
  </header>

  <div class="upd" id="updatebar" hidden role="status"></div>

  <section class="view" id="v-chat" hidden>
    <div class="log" id="log" role="log" aria-live="polite" aria-label="Conversation"></div>
    <div class="chips" id="chips"></div>
    <form class="k-composer" id="form">
      <input class="k-field" id="msg" autocomplete="off" enterkeyhint="send" placeholder="Type a command or help" aria-label="Message">
      <button class="k-btn k-btn--primary" aria-label="Send" id="send"></button>
    </form>
  </section>

  <section class="view" id="v-overview" hidden><div class="scroll" id="overview"></div></section>
  <section class="view" id="v-learn" hidden><div class="scroll" id="learn"></div></section>
  <section class="view" id="v-control" hidden><div class="scroll" id="control"></div></section>
  <section class="view" id="v-keep" hidden>
    <div class="scroll" id="keep"></div>
    <div class="stack" id="keepActions"></div>
  </section>

  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</div>
<script>
(function () {
  "use strict";
  var TOKEN_KEY = "fx-token", HISTORY_KEY = "fx-chat", SEEN_KEY = "fx-keep-seen", STEP3_KEY = "fx-step3";
  var MAX_HISTORY = 60, REFRESH_MS = 20000, KEEP_POLL_MS = 2000, RISK_STEP = 0.1;
  var bridge = window.Kestrel || null;

  var ICONS = {
    up: "M12 19V5M5 12l7-7 7 7", down: "M12 5v14M19 12l-7 7-7-7", flat: "M5 12h14",
    pause: "M8 5v14M16 5v14", alert: "M12 3l10 18H2L12 3zM12 10v5M12 18h.01",
    refresh: "M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7", send: "M3 11l18-8-8 18-2-8-8-2z",
    check: "M5 12l5 5 9-10", chat: "M4 5h16v11H9l-5 4V5z",
    grid: "M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z", sliders: "M4 7h10M18 7h2M4 17h2M10 17h10M14 5v4M6 15v4",
    book: "M4 5h6a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H4V5zM20 5h-6a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h7V5z", share: "M12 3v12M7 8l5-5 5 5M5 14v6h14v-6"
  };
  var NS = "http://www.w3.org/2000/svg";

  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === "class") el.className = attrs[k];
      else if (k === "text") el.textContent = attrs[k];
      else if (k.indexOf("on") === 0) el.addEventListener(k.slice(2), attrs[k]);
      else el.setAttribute(k, attrs[k]);
    });
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c == null || c === false) continue;
      el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
    return el;
  }
  function icon(name, cls) {
    var s = document.createElementNS(NS, "svg");
    s.setAttribute("class", "k-icon" + (cls ? " " + cls : ""));
    s.setAttribute("viewBox", "0 0 24 24");
    s.setAttribute("aria-hidden", "true");
    var p = document.createElementNS(NS, "path");
    p.setAttribute("d", ICONS[name]);
    s.appendChild(p);
    return s;
  }
  function $(id) { return document.getElementById(id); }
  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }

  var q = new URLSearchParams(location.search);
  if (q.get("t")) { localStorage.setItem(TOKEN_KEY, q.get("t")); window.history.replaceState(null, "", location.pathname + location.hash); }
  var token = function () { return localStorage.getItem(TOKEN_KEY) || ""; };

  function api(path, body) {
    return fetch(path, {
      method: body ? "POST" : "GET",
      headers: { "content-type": "application/json", "x-fx-token": token() },
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok) throw new Error(j.error || j.reply || ("HTTP " + r.status));
        return j;
      });
    });
  }

  function applyTheme() {
    var light = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
    document.documentElement.setAttribute("data-theme", light ? "light" : "dark");
  }
  applyTheme();
  if (window.matchMedia) window.matchMedia("(prefers-color-scheme: light)").addEventListener("change", applyTheme);

  function money(n, plus) {
    var s = Math.abs(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return (n < 0 ? "-" : plus && n > 0 ? "+" : "") + s;
  }
  function ago(min) {
    if (min == null) return "no candle yet";
    if (min < 1) return "just now";
    if (min < 60) return min + " min ago";
    if (min < 1440) return Math.floor(min / 60) + " h ago";
    return Math.floor(min / 1440) + " d ago";
  }
  function dirIcon(d) { return icon(d === "bull" ? "up" : d === "bear" ? "down" : "flat"); }
  function dirWord(d) { return d === "bull" ? "Bull" : d === "bear" ? "Bear" : "No trend"; }
  function price(n) { return n.toFixed(n > 20 ? 3 : 5); }

  function badge(kind, text, iconName) {
    var cls = { live: "k-badge k-badge--live", paused: "k-badge k-badge--paused", problem: "k-badge k-badge--problem", neutral: "k-badge" }[kind] || "k-badge";
    return h("span", { class: cls }, iconName ? icon(iconName) : null, text);
  }
  function stateBadge(s) {
    if (s === "live") return badge("live", "Live");
    if (s === "problem") return badge("problem", "Problem", "alert");
    if (s === "stale") return badge("paused", "Stale", "alert");
    if (s === "closed") return badge("neutral", "Market closed");
    return badge("neutral", "Warming up");
  }
  function row(leading, title, meta, trailing) {
    return h("div", { class: "k-row" }, leading,
      h("div", { class: "k-row__main" }, h("div", { class: "k-row__title", text: title }), h("div", { class: "k-row__meta", text: meta })), trailing);
  }

  // ---------- header state ----------
  function setHeader(ov) {
    var el = $("state");
    var kind = "live", text = "Live", ic = null;
    if (ov.paused) { kind = "paused"; text = "Paused"; ic = "pause"; }
    else if (ov.pairs.some(function (p) { return p.state === "problem"; })) { kind = "problem"; text = "Problem"; ic = "alert"; }
    else if (ov.market_closed) { kind = "neutral"; text = "Market closed"; }
    else if (ov.pairs.every(function (p) { return p.state === "warming"; })) { kind = "neutral"; text = "Warming up"; }
    el.className = "k-appbar__end " + ({ live: "k-badge k-badge--live", paused: "k-badge k-badge--paused", problem: "k-badge k-badge--problem", neutral: "k-badge" })[kind];
    clear(el);
    if (ic) el.appendChild(icon(ic));
    el.appendChild(document.createTextNode(text));
    el.hidden = false;
  }

  // ---------- chat ----------
  var convo = [];
  try { convo = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]"); } catch (e) { convo = []; }
  function save() { localStorage.setItem(HISTORY_KEY, JSON.stringify(convo.slice(-MAX_HISTORY))); }

  // Light formatting for model replies, built with DOM nodes so reply text is never parsed as HTML.
  function rich(text) {
    var box = h("div", { class: "k-bubble" });
    box.style.whiteSpace = "normal";
    text.split("\n").forEach(function (line, i) {
      var bullet = /^\s*[-*\u2022]\s+/.test(line);
      var body = line.replace(/^\s*[-*\u2022]\s+/, "");
      var p = h("div", { class: bullet ? "li" : "" });
      if (!line.trim()) p.style.height = "8px";
      if (bullet) p.appendChild(document.createTextNode("\u2022 "));
      body.split(/(\*\*[^*]+\*\*)/).forEach(function (seg) {
        if (/^\*\*[^*]+\*\*$/.test(seg)) p.appendChild(h("strong", { text: seg.slice(2, -2) }));
        else if (seg) p.appendChild(document.createTextNode(seg));
      });
      box.appendChild(p);
    });
    return box;
  }
  function bubble(m) {
    if (m.who === "me") return h("div", { class: "k-bubble k-bubble--me", text: m.text });
    if (!m.card) return m.text.indexOf("\n") >= 0 || m.text.indexOf("**") >= 0 ? rich(m.text) : h("div", { class: "k-bubble", text: m.text });
    var grid = h("div", { class: "res" });
    m.card.rows.forEach(function (r) {
      grid.appendChild(h("span", { class: "l", text: r[0] }));
      grid.appendChild(h("span", { class: "v" }, r[2] ? icon(r[2]) : null, r[1]));
    });
    return h("div", { class: "k-bubble k-bubble--wide" },
      h("div", { style: "font-weight:600", text: m.card.title }), grid, h("div", { class: "note", text: m.card.note }));
  }
  function renderLog() {
    var log = $("log");
    clear(log);
    if (!convo.length) convo.push({ who: "bot", text: "Paper account only. No broker, no real money. Type help for commands." });
    convo.slice(-MAX_HISTORY).forEach(function (m) { log.appendChild(bubble(m)); });
    log.scrollTop = log.scrollHeight;
  }
  function push(m) { convo.push(m); save(); var log = $("log"); log.appendChild(bubble(m)); log.scrollTop = log.scrollHeight; }

  var busy = false;
  function send(text) {
    text = (text || "").trim();
    if (!text || busy) return;
    busy = true;
    push({ who: "me", text: text });
    var wait = h("div", { class: "k-bubble", text: "Working…" });
    $("log").appendChild(wait);
    $("log").scrollTop = $("log").scrollHeight;
    api("/api/chat", { message: text, history: convo.slice(-9, -1).map(function (m) { return { who: m.who, text: m.text }; }) }).then(function (j) {
      wait.remove();
      push({ who: "bot", text: j.reply, card: j.card || null });
    }).catch(function (e) {
      wait.remove();
      push({ who: "bot", text: "Could not reach the harness: " + e.message });
    }).then(function () { busy = false; });
  }
  function buildChat() {
    $("send").appendChild(icon("send"));
    var chips = $("chips");
    ["status", "setups", "backtest", "journal", "refresh", "help"].forEach(function (c) {
      chips.appendChild(h("button", { class: "k-chip", type: "button", onclick: function () { send(c); } }, c));
    });
    $("form").addEventListener("submit", function (e) { e.preventDefault(); var t = $("msg").value; $("msg").value = ""; send(t); });
    renderLog();
  }

  // ---------- overview ----------
  function renderOverview(ov) {
    var el = $("overview");
    clear(el);
    var change = ov.change;
    var delta = Math.abs(change) < 0.005
      ? h("div", { class: "k-delta k-delta--flat", text: "USD · no change yet" })
      : h("div", { class: "k-delta" }, icon(change > 0 ? "up" : "down"), money(change, true) + " USD");
    var ugx = ov.ugx ? h("div", { class: "ugx", text: "\u2248 UGX " + Math.round(ov.equity * ov.ugx.rate).toLocaleString("en-US") }) : null;
    el.appendChild(h("div", { class: "grid2" },
      h("div", { class: "k-tile" }, h("div", { class: "k-tile__label", text: "Equity" }), h("div", { class: "k-tile__value", text: money(ov.equity) }), delta, ugx),
      h("div", { class: "k-tile" }, h("div", { class: "k-tile__label", text: "Open trades" }), h("div", { class: "k-tile__value", text: String(ov.open) }),
        h("div", { class: "k-delta k-delta--flat", text: "of " + ov.max_open + " allowed" }))));

    var watching = h("div", { class: "card" });
    ov.pairs.forEach(function (p) {
      var meta = p.state === "warming" ? "waiting for the first candles" : p.zones + (p.zones === 1 ? " zone" : " zones") + " · candle " + ago(p.age_min);
      watching.appendChild(row(dirIcon(p.trend), p.pair + " · " + dirWord(p.trend), meta, stateBadge(p.state)));
      if (p.error) watching.appendChild(h("div", { class: "err note", text: "Feed problem: " + p.error }));
    });
    el.appendChild(h("section", null, h("h2", { class: "sec", text: "Watching" }), watching));

    if (ov.zones.length) {
      var zones = h("div", { class: "card" });
      ov.zones.forEach(function (z) {
        zones.appendChild(row(dirIcon(z.dir), z.pair + " · " + dirWord(z.dir) + " " + z.label, price(z.bottom) + " to " + price(z.top), badge("neutral", "Watching")));
      });
      el.appendChild(h("section", null, h("h2", { class: "sec", text: "Zones" }), zones));
    }

    var pos = h("section", null, h("h2", { class: "sec", text: "Open positions" }));
    if (ov.positions.length) {
      var card = h("div", { class: "card" });
      ov.positions.forEach(function (p) {
        card.appendChild(row(dirIcon(p.dir), (p.dir === "bull" ? "Long " : "Short ") + p.pair,
          Math.round(p.units).toLocaleString("en-US") + " units · stop " + price(p.stop), badge("live", "Open")));
      });
      pos.appendChild(card);
    } else {
      pos.appendChild(h("p", { class: "muted", text: "No open positions. An entry waits for a retest of a zone, and the risk rules can skip it." }));
    }
    el.appendChild(pos);

    if (ov.recent.length) {
      var rc = h("div", { class: "card" });
      ov.recent.forEach(function (t) {
        var up = t.r > 0.005, down = t.r < -0.005;
        rc.appendChild(row(icon(up ? "up" : down ? "down" : "flat"), (t.dir === "bull" ? "Long " : "Short ") + t.pair,
          (t.r >= 0 ? "+" : "") + t.r.toFixed(2) + " R · " + money(t.pnl, true) + " USD", null));
      });
      el.appendChild(h("section", null, h("h2", { class: "sec", text: "Recent trades" }), rc));
    }
  }

  // ---------- control ----------
  var ctl = null, riskTimer = null;
  function postControl(body) {
    return api("/api/control", body).then(function (j) { ctl = j; renderControl(); return refreshOverview(); });
  }
  function renderControl() {
    if (!ctl) return;
    var el = $("control");
    clear(el);
    var toggle = ctl.paused
      ? h("button", { class: "k-btn k-btn--primary", onclick: function () { postControl({ paused: false }); } }, icon("refresh"), "Resume entries")
      : h("button", { class: "k-btn k-btn--secondary", onclick: function () { postControl({ paused: true }); } }, icon("pause"), "Pause entries");

  // ---------- router ----------
  var ROUTES = { "#/chat": "chat", "#/overview": "overview", "#/learn": "learn", "#/control": "control", "#/keep-running": "keep" };
  var TABS = [["#/chat", "Chat", "chat"], ["#/overview", "Overview", "grid"], ["#/learn", "Learn", "book"], ["#/control", "Control", "sliders"]];
  function buildTabs() {
    var nav = $("tabs");
    TABS.forEach(function (t) { nav.appendChild(h("a", { href: t[0], "data-route": t[0] }, icon(t[2]), t[1])); });
  }
  var current = "";
  function route() {
    var hash = ROUTES[location.hash] ? location.hash : "#/chat";
    if (bridge && !localStorage.getItem(SEEN_KEY) && !location.hash) { hash = "#/keep-running"; }
    var name = ROUTES[hash];
    current = name;
    Object.keys(ROUTES).forEach(function (k) { $("v-" + ROUTES[k]).hidden = ROUTES[k] !== name; });
    var keep = name === "keep";
    $("bar").hidden = keep; $("tabs").hidden = keep;
    renderUpdateBar();
    $("title").textContent = name === "control" ? "Control" : "Kestrel";
    document.title = name === "control" ? "Kestrel control" : "Kestrel";
    Array.prototype.forEach.call($("tabs").children, function (a) {
      if (a.getAttribute("data-route") === hash) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    if (name === "overview") refreshOverview();
    if (name === "control") refreshControl();
    if (name === "learn") refreshControl().then(renderLearn);
    if (name === "keep") renderKeep();
    if (name === "chat") $("log").scrollTop = $("log").scrollHeight;
  }

  function refreshOverview() {
    return api("/api/overview").then(function (ov) { setHeader(ov); if (current === "overview") renderOverview(ov); }).catch(function (e) {
      if (current === "overview") { var el = $("overview"); clear(el); el.appendChild(h("p", { class: "muted", text: "Could not load the overview: " + e.message })); }
    });
  }
  function refreshControl() {
    return api("/api/control").then(function (j) { ctl = j; if (current === "control") renderControl(); }).catch(function (e) {
      if (current === "control") { var el = $("control"); clear(el); el.appendChild(h("p", { class: "muted", text: "Could not load the controls: " + e.message })); }
    });
  }

  buildTabs();
  buildChat();
  window.addEventListener("hashchange", route);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) { if (current === "keep") renderKeep(); if (current === "control") renderControl(); refreshOverview(); } });
  route();
  refreshOverview();
  refreshUpdate();
  setInterval(function () { if (upd && upd.phase === "downloading") refreshUpdate(); }, 1000);
  setInterval(function () { if (bridge && current === "keep" && keepState().join() !== keepSig) renderKeep(); }, KEEP_POLL_MS);
  setInterval(function () { if (!document.hidden) { refreshUpdate(); refreshOverview(); if (current === "control") refreshControl(); } }, REFRESH_MS);
})();
</script>
</body>
</html>
